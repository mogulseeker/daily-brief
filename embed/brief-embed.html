<!-- Daily Brief - all-in-one embed (no external script).
     GENERATED FROM brief-embed.js by build-inline.py. Do not hand-edit.

     Prefer snippet.html: it is ~300 characters instead of ~11KB, which matters
     because Google Sites caps its embed-code box at 10,000 characters, and a
     pasted script can be corrupted in transit (a curly apostrophe becoming a
     straight one is enough to kill the entire block silently). -->
<div class="daily-brief-embed"
     data-feed="https://mogulseeker.github.io/daily-brief/embed/latest.json"
     data-show="full"
     data-theme="light"></div>
<script>
/* Daily Brief - embeddable widget
 *
 * Served from GitHub Pages so a host page only needs two lines:
 *
 *   <div class="daily-brief-embed"
 *        data-feed="https://mogulseeker.github.io/daily-brief/embed/latest.json"
 *        data-theme="light"></div>
 *   <script src="https://mogulseeker.github.io/daily-brief/embed/brief-embed.js"><\/script>
 *
 * Options on the div:
 *   data-feed   (required) URL of latest.json
 *   data-show   "full" (default) | "tldr" | "plain"
 *   data-limit  max items to render, e.g. "5" (default: all)
 *   data-theme  "auto" (default) | "light" | "dark"
 *
 * Everything renders inside a shadow root, so the host page's CSS cannot leak
 * in and this widget's CSS cannot leak out.
 *
 * "auto" matches the PAGE, not the operating system: it walks up the DOM for
 * the first real background colour and measures its luminance. Trusting
 * prefers-color-scheme instead would put near-white text on a white page for
 * any visitor with dark mode on.
 *
 * THIS FILE IS DELIBERATELY PURE ASCII. Every non-ASCII character is written
 * as a \uXXXX escape. Smart quotes inside a string literal are how the inline
 * version of this widget broke: one curly apostrophe became a straight one in
 * transit, closed its string early, and took the whole script down with no
 * visible error. Keep it ASCII and that failure cannot recur. Verify with
 * `node --check brief-embed.js` before committing.
 */
(function () {
  "use strict";

  var CSS = [
    ':host{display:block;container-type:inline-size}',
    '*{box-sizing:border-box}',
    ':host{',
    '--page:#ffffff;--surface:#f7f6f3;--border:#e5e1d9;--text:#1a1a18;',
    '--muted:#6b6862;--accent:#9a3412;--rule:#ede9e0;',
    '--plain-bg:#eef1f5;--plain-ink:#3a4a5c;--plain-border:#dde3ea;--plain-label:#4d6480;',
    '--mono:"Courier New",Courier,monospace}',
    ':host([data-resolved="dark"]){',
    '--page:#14140f;--surface:#1c1c17;--border:#2f2f27;--text:#f0efe9;',
    '--muted:#9d9a90;--accent:#fb923c;--rule:#26261f;',
    '--plain-bg:#161b21;--plain-ink:#c3d2e0;--plain-border:#262d36;--plain-label:#8fa9c4}',
    '.root{font-family:var(--mono);font-size:15px;line-height:1.7;color:var(--text);',
    'background:var(--page);max-width:44rem;padding:1.75rem 2rem 2rem;border-radius:8px}',
    '@container (max-width:34rem){.root{padding:1.25rem 1.25rem 1.5rem}}',
    '.hd{border-bottom:2px solid var(--text);padding-bottom:.75rem;margin-bottom:1.5rem;',
    'display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem .75rem}',
    '.hd h2{font-size:1.375rem;margin:0;font-family:var(--mono);font-weight:700;',
    'text-transform:uppercase;letter-spacing:.04em}',
    '.hd .date{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;',
    'letter-spacing:.08em;color:var(--muted)}',
    '.tldr{background:var(--surface);border:1px solid var(--border);border-radius:6px;',
    'padding:1.125rem 1.375rem;margin-bottom:2rem}',
    '.tldr h3{font-family:var(--mono);font-size:.6875rem;text-transform:uppercase;',
    'letter-spacing:.1em;color:var(--muted);margin:0 0 .625rem;font-weight:700}',
    '.tldr ol{margin:0;padding-left:1.25rem;font-size:.875rem}',
    '.tldr li{margin-bottom:.4rem}.tldr li:last-child{margin-bottom:0}',
    '.item{padding-top:1.5rem;margin-top:1.5rem;border-top:1px solid var(--rule)}',
    '.item:first-of-type{border-top:0;margin-top:0;padding-top:0}',
    '.cat{font-family:var(--mono);font-size:.6875rem;text-transform:uppercase;',
    'letter-spacing:.1em;color:var(--accent);font-weight:700;margin-bottom:.35rem}',
    '.item h4{font-family:var(--mono);font-size:1.0625rem;line-height:1.45;margin:0 0 .55rem;',
    'text-wrap:balance;font-weight:700}',
    '@container (max-width:34rem){.hd h2{font-size:1.125rem}.item h4{font-size:1rem}}',
    '.item p{margin:0 0 .7rem}',
    '.plain{background:var(--plain-bg);border:1px solid var(--plain-border);border-radius:6px;',
    'padding:.8rem 1.0625rem .9rem;color:var(--plain-ink);font-family:var(--mono);',
    'font-size:.875rem;line-height:1.75}',
    '.plain b{display:block;font-size:.6875rem;text-transform:uppercase;letter-spacing:.09em;',
    'color:var(--plain-label);margin-bottom:.25rem;font-weight:700}',
    '.why{border-left:3px solid var(--accent);padding-left:.8rem}',
    '.why b{display:block;font-family:var(--mono);font-size:.75rem;text-transform:uppercase;',
    'letter-spacing:.06em;color:var(--accent);margin-bottom:.15rem}',
    '.src{font-family:var(--mono);font-size:.75rem;color:var(--muted)}',
    '.src a{color:var(--muted);text-decoration:underline;text-underline-offset:2px}',
    '.src a:hover{color:var(--accent)}',
    'a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}',
    '.ft{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--rule);',
    'font-family:var(--mono);font-size:.75rem;color:var(--muted)}',
    '.msg{font-family:var(--mono);font-size:.875rem;color:var(--muted);padding:1rem 0}',
    '@media (prefers-reduced-motion:no-preference){.root{animation:fade .25s ease-out}',
    '@keyframes fade{from{opacity:0}to{opacity:1}}}'
  ].join('');

  var SAFE = /^https?:\/\//i;
  var DOT = ' \u00b7 ';   // middle dot, escaped so this file stays pure ASCII
  var ELLIPSIS = '\u2026';

  /* Resolve the effective background behind an element, then decide whether
     this widget needs its light or dark token set. Returns true for dark. */
  function pageIsDark(node) {
    var el = node;
    while (el) {
      var bg = window.getComputedStyle(el).backgroundColor;
      var m = /^rgba?\(([^)]+)\)/.exec(bg || '');
      if (m) {
        var p = m[1].split(',').map(parseFloat);
        var alpha = p.length > 3 ? p[3] : 1;
        if (alpha > 0.12) {
          // Rec. 709 relative luminance on the sRGB values, good enough here.
          var lum = (0.2126 * p[0] + 0.7152 * p[1] + 0.0722 * p[2]) / 255;
          return lum < 0.5;
        }
      }
      el = el.parentElement;
    }
    // Nothing painted anywhere up the tree: fall back to the OS preference.
    return !!(window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function link(url, label) {
    if (!SAFE.test(String(url || ''))) return el('span', null, label);
    var a = el('a', null, label);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    return a;
  }

  function render(root, data, show, limit) {
    root.textContent = '';
    var wrap = el('div', 'root');

    var hd = el('div', 'hd');
    hd.appendChild(el('h2', null, 'Daily Brief'));
    hd.appendChild(el('span', 'date', data.dateLabel || data.date || ''));
    wrap.appendChild(hd);

    var items = Array.isArray(data.items) ? data.items.slice() : [];
    if (limit > 0) items = items.slice(0, limit);

    if (show !== 'plain' && Array.isArray(data.tldr) && data.tldr.length) {
      var box = el('div', 'tldr');
      box.appendChild(el('h3', null, 'The whole thing in 30 seconds'));
      var ol = el('ol');
      var lines = limit > 0 ? data.tldr.slice(0, limit) : data.tldr;
      lines.forEach(function (t) { ol.appendChild(el('li', null, t)); });
      box.appendChild(ol);
      wrap.appendChild(box);
    }

    if (show !== 'tldr') {
      items.forEach(function (it) {
        var d = el('div', 'item');
        if (it.category) d.appendChild(el('div', 'cat', it.category));
        if (it.headline) d.appendChild(el('h4', null, it.headline));

        if (show === 'full' && it.body) d.appendChild(el('p', null, it.body));

        if (it.plain) {
          var p = el('p', 'plain');
          p.appendChild(el('b', null, 'In plain terms'));
          p.appendChild(document.createTextNode(it.plain));
          d.appendChild(p);
        }

        if (show === 'full' && it.why) {
          var w = el('p', 'why');
          w.appendChild(el('b', null, 'Why it matters'));
          w.appendChild(document.createTextNode(it.why));
          d.appendChild(w);
        }

        if (show === 'full' && Array.isArray(it.sources) && it.sources.length) {
          var s = el('p', 'src');
          s.appendChild(document.createTextNode('Sources: '));
          it.sources.forEach(function (src, i) {
            if (i) s.appendChild(document.createTextNode(DOT));
            s.appendChild(link(src.url, src.outlet || 'source'));
          });
          d.appendChild(s);
        }
        wrap.appendChild(d);
      });
    }

    var ft = el('div', 'ft');
    ft.appendChild(document.createTextNode(
      (data.dateLabel ? data.dateLabel + DOT : '') + items.length + ' items'
    ));
    wrap.appendChild(ft);
    root.appendChild(wrap);
  }

  function boot(host) {
    if (host.__dbInit) return;
    host.__dbInit = true;

    var feed = host.getAttribute('data-feed');
    var show = host.getAttribute('data-show') || 'full';
    var limit = parseInt(host.getAttribute('data-limit') || '0', 10) || 0;
    var theme = host.getAttribute('data-theme') || 'auto';

    var shadow = host.attachShadow({ mode: 'open' });
    var style = document.createElement('style');
    style.textContent = CSS;
    shadow.appendChild(style);
    var mount = document.createElement('div');
    shadow.appendChild(mount);

    function applyTheme() {
      var dark = theme === 'dark' ||
                 (theme !== 'light' && pageIsDark(host));
      host.setAttribute('data-resolved', dark ? 'dark' : 'light');
    }
    applyTheme();
    if (theme === 'auto' && window.matchMedia) {
      // Re-measure if the host page itself responds to an OS theme change.
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var recheck = function () { setTimeout(applyTheme, 0); };
      mq.addEventListener ? mq.addEventListener('change', recheck)
                          : mq.addListener(recheck);
    }

    mount.appendChild(el('div', 'msg', 'Loading the brief' + ELLIPSIS));

    if (!feed || /REPLACE-ME/.test(feed)) {
      mount.textContent = '';
      mount.appendChild(el('div', 'msg',
        'Set data-feed on this element to your latest.json URL.'));
      return;
    }

    /* Append a per-minute cache-buster. The feed is served with max-age=600,
       and an intermediate cache handing back a stale copy is indistinguishable
       from the brief not having run - so make the URL itself change instead of
       trusting revalidation. Per-minute rather than per-request keeps it
       cacheable for repeat views within the same minute. */
    var bust = 'ndb=' + Math.floor(Date.now() / 60000);
    var url = feed + (feed.indexOf('?') === -1 ? '?' : '&') + bust;

    fetch(url, { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) { render(mount, data, show, limit); })
      .catch(function (err) {
        mount.textContent = '';
        mount.appendChild(el('div', 'msg',
          'The brief is not available right now.'));
        if (console && console.warn) console.warn('[daily-brief]', err);
      });
  }

  function init() {
    var nodes = document.querySelectorAll('.daily-brief-embed');
    for (var i = 0; i < nodes.length; i++) boot(nodes[i]);
  }

  document.readyState === 'loading'
    ? document.addEventListener('DOMContentLoaded', init)
    : init();
})();
</script>
